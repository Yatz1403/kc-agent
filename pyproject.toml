[project]
name = "kc-agent"
version = "0.1.0"
description = "Enterprise Knowledge Context Agent - skeleton against docs/kc-agent-frs.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kc*"]

[tool.setuptools.package-data]
"kc.config" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
