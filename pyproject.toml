[project]
name = "kc-agent"
version = "0.1.0"
description = "Enterprise Knowledge Context Agent — implementation of docs/kc-agent-frs.md v0.3"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["kc*"]

[tool.setuptools.package-data]
"kc.config" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
